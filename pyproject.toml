[tool.poetry]
name = "bank_transactions"
version = "0.1.0"
description = "A project for processing bank transactions"
authors = ["Your Name <your.email@example.com>"]

[tool.poetry.dependencies]
python = "^3.13"
requests = "^2.31.0"
pandas = "^2.1.0"
python-dotenv = "^1.0.0"

[tool.poetry.group.lint.dependencies]
flake8 = "^6.1.0"
black = "^23.11.0"
isort = "^5.12.0"
mypy = "^1.6.0"
pytest = "^7.4.0"
pytest-cov = "^4.1.0"

[tool.black]
line-length = 119
exclude = '''
.git
'''

[tool.isort]
line_length = 119
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = "venv"
